name: Build Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TGBLOCKER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tgblocker-release.jks"
            echo "TGBLOCKER_KEYSTORE_PATH=$RUNNER_TEMP/tgblocker-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::TGBLOCKER_KEYSTORE_BASE64 secret belum diset - APK akan pakai debug-keystore biasa (signature beda tiap build, harus uninstall dulu buat update)."
          fi

      - name: Build debug APK
        env:
          TGBLOCKER_KEYSTORE_PASSWORD: ${{ secrets.TGBLOCKER_KEYSTORE_PASSWORD }}
          TGBLOCKER_KEY_ALIAS: ${{ secrets.TGBLOCKER_KEY_ALIAS }}
          TGBLOCKER_KEY_PASSWORD: ${{ secrets.TGBLOCKER_KEY_PASSWORD }}
          TGBLOCKER_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TelegramChannelBlocker-debug-apk
          path: app/build/outputs/apk/debug/*.apk
